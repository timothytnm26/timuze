<!doctype html>
<html lang="vi" data-skin="minimal">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <script>
      // apply the saved skin before first paint – key & list mirror src/shared/theme
      try {
        var skin = JSON.parse(localStorage.getItem('timuze.skin'))
        if (['minimal', 'retro', 'pixel', 'glass'].indexOf(skin) > -1) document.documentElement.dataset.skin = skin
      } catch (e) {}
    </script>
    <title>timuze — Spotify stats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
